[project]
name = "citepilot"
version = "0.1.0"
description = "带出处引用的垂直知识问答 Agent —— 检索 / 记忆 / 评测全链路"
requires-python = ">=3.11"
dependencies = [
    "litellm",
    "httpx",
    "pydantic",
    "python-dotenv",
    "rich",
    "fastapi",
    "uvicorn",
    "beautifulsoup4",
    "lxml",
    "numpy",
    "jieba",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
citepilot = "citepilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citepilot"]
