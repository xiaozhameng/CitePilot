server:
  port: 8090
  # SSE 长连接：不要设太短的 idle-timeout，否则流式会被容器提前掐断
  netty:
    connection-timeout: 10s

spring:
  application:
    name: citepilot-gateway
  codec:
    # 流式 SSE 与 multipart 转发本身都是流式的，这个值限制的是"需要整体缓冲"的场景。
    # 但知识库上传会让请求体经过编解码器，2MB 在传一份 PDF 时会直接报
    # DataBufferLimitException —— 所以放大到 16MB。
    max-in-memory-size: 16MB

gateway:
  kernel:
    base-url: ${CITEPILOT_KERNEL_URL:http://127.0.0.1:8077}
    # 与内核 .env 里的 CITEPILOT_INTERNAL_TOKEN 必须一致
    token: ${CITEPILOT_INTERNAL_TOKEN:dev-local-token-change-me}
    connect-timeout: 3s
    read-timeout: 60s
    stream-idle-timeout: 45s
    max-connections: 64

  rate-limit:
    enabled: true
    # 桶容量 = 允许的突发；补充速率 = 稳态 QPS
    burst: 6
    refill-per-second: 0.5
    # 真正保护内核的那道闸：内核单实例，并发 8 已是它的舒适区上限
    max-concurrent-streams: 8

  session:
    max-turns: 20
    idle-timeout: 30m
    max-sessions: 500

  corpus:
    # 内置语料的根目录。引用里的锚点长这样：
    #   corpus/payment-handbook/index.html#ch-3-2
    # 它必须真的能通过 HTTP 打开，否则「查看原文」就是 404。
    # 默认 ../corpus —— 网关的工作目录是 CitePilot/gateway。
    # 生产环境把它关掉，交给 nginx / CDN 托管。
    enabled: true
    dir: ${CITEPILOT_CORPUS_ROOT:../corpus}

  audit:
    enabled: true
    path: var/gateway-audit.jsonl
    memory-buffer: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.citepilot.gateway: DEBUG
    # WebClient 的 DEBUG 日志会把每次请求的完整 body 打出来，噪音太大
    org.springframework.web.reactive.function.client: INFO
